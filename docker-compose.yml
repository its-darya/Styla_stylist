services:
  db:
    image: pgvector/pgvector:pg16
    container_name: styla_db
    environment:
      POSTGRES_USER: styla
      POSTGRES_PASSWORD: styla
      POSTGRES_DB: styla
    ports:
      - "5432:5432"
    volumes:
      - styla_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U styla -d styla"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  styla_pgdata:
